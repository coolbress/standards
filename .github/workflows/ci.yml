name: CI
#
# 이 저장소의 무결성 검사. 전부 오프라인이라 Actions 분을 거의 쓰지 않는다
# (비공개 저장소는 Free 플랜에서 2,000분/월 과금 — corpus/aspects/04 visibility-provision-matrix).
# 네트워크가 필요한 외부 URL 감사는 url-audit.yml 에서 월 1회만 돈다.
#
# Actions는 커밋 SHA로 핀한다 (corpus/aspects/04 foundation-floor-artifact-checklist: MUST).
# 인라인 주석의 버전은 핀된 SHA가 가리키는 태그다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 체크아웃은 기본으로 토큰을 `.git/config` 에 남긴다(zizmor `artipacked`).
          # 이 저장소의 잡은 **아무것도 푸시하지 않는다** — 그래서 끈다.
          persist-credentials: false
      # 🔴 버전을 여기 적지 않는다 — `.python-version` 이 정본이다.
      # 로컬(pyenv)과 CI 가 **같은 파일**을 읽어야 갈라지지 않는다.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: 코퍼스 구조 검증
        run: python3 tools/validate_corpus.py

      - name: 라우팅 지도 최신 여부
        run: node tools/build-routes.mjs --check

      - name: 검색 계약 (30/30)
        run: python3 tools/evaluate_retrieval_contract.py

      # 수치 인용에 축(uni/wgt · present/adequate)과 n 이 붙어 있는가.
      # `direction/05` 가 한때 같은 `X/Y` 표기를 두 뜻으로 써서 adequate 41.2% 가
      # 70% 로 읽혔다. 규약을 문장으로 두면 발화하지 않으므로 검사로 둔다.
      # 기준선 대비다 — 기존 후보는 막지 않고 **새 위반만** 막는다.
      - name: 수치 인용 표기 (기준선 대비)
        run: python3 tools/check_figure_citations.py

      # 센서스가 재는 산출물마다 바닥이 입장을 밝혔는가. AGENTS.md·이슈 폼·머지 방법이
      # 전부 "실물이 하는데 바닥이 침묵" 이었다. 요구든 기각이든 적혀 있어야 한다 —
      # 침묵은 다음 사람이 "빠뜨린 건가" 를 매번 다시 묻게 만든다.
      - name: 바닥 커버리지 (센서스 대조)
        run: python3 tools/check_floor_coverage.py

      # 🔴 `F` 계열(pyflakes)만 켠다 — 그 안에 **`F821 undefined-name`** 이 있다.
      # 2026-08-29: `check_decision_referrals.py` 가 `ROOT` 를 정의 없이 써서 **실행하자마자 터졌다.**
      # mypy 도 잡는다(`Name "ROOT" is not defined`)지만 tools/ 전체는 38건이라 별건이다(R5-39).
      # 이건 2건이었고 지금 0 이다 — **가장 싼 자리에서 가장 자주 나는 버그를 막는다.**
      # 🔴 **액션을 하나 더 들이지 않는다.** `astral-sh/setup-uv` 를 쓰려 했더니
      # 이 저장소의 Actions **허용목록**에 없어 워크플로가 `startup_failure` 로 죽었다.
      # 허용목록 변경은 **관리자 토큰**이 필요한데, 검사 하나를 위해 벽을 건드릴 값이 아니다.
      # `pip` 은 액션이 아니므로 허용목록과 무관하다.
      # ⚠️ 버전을 **박는다** — 안 박으면 ruff 가 새 규칙을 들고 오는 날 CI 가 무관하게 빨개진다.
      # 🔴 **규칙 목록을 여기 적지 않는다 — `ruff.toml` 이 정본이다.**
      # 위 `.python-version` 과 같은 이유다: 로컬과 CI 가 **같은 파일**을 읽어야 갈라지지 않는다.
      # 예전 판은 `--select` 를 이 줄에 박아서, 로컬에서 `ruff check tools/` 를 그냥 돌리면
      # CI 와 다른 규칙으로 재고 있었다. 끄는 규칙의 **근거도 그 파일에** 산다.
      # 2026-08-29: `E`(E501 제외 · 0건) 와 `S`(bandit) 를 더해 **열두 규칙군**이 됐다.
      # 🔒 워크플로 **보안** 정적분석. `actionlint` 이 정확성을 보고 이건 보안을 본다 —
      # 대안이 아니라 층이다(연구 합의). 템플릿 인젝션 · 자격증명 유출 · 캐시 오염 ·
      # impostor commit(SHA 로 핀한 척하지만 그 저장소 히스토리에 없는 커밋 — 우린 전부 SHA 핀이다).
      # ⚠️ **버전을 박는다** — 안 박으면 새 감사 규칙이 들어오는 날 CI 가 무관하게 빨개진다.
      # `pipx` 는 러너에 이미 있고 **액션이 아니라** 이 저장소의 좁은 allowlist 와 무관하다.
      - name: 워크플로 보안 (zizmor)
        run: pipx run zizmor==1.29.0 --no-progress .github/workflows/

      - name: tools/ 린트 (규칙군을 하나씩 켠다 — R5-39)
        run: |
          python -m pip install --quiet --disable-pip-version-check 'ruff==0.16.5'
          ruff check tools/

      # 🔴 이 검사를 열게 만든 사건이 여기 있다 — `check_decision_referrals.py` 가 `ROOT` 를
      # 정의 없이 써서 **실행하자마자 `NameError`** 로 터졌고, mypy 는 그걸
      # `Name "ROOT" is not defined` 로 **정확히** 잡는다.
      # 바닥이 프로젝트에 `typecheck` 를 **별도 required check** 로 요구하는데 이 저장소만
      # 자기 파이썬 33파일에 안 돌리고 있었다 — `diff-size`(R5-34)와 같은 형태의 자기 면제다.
      # 🔴 **설정은 `mypy.ini` 가 정본**이다. 여기 플래그를 박으면 로컬이 다른 걸 잰다.
      - name: tools/ 타입 검사 (mypy strict — R5-39)
        run: |
          python -m pip install --quiet --disable-pip-version-check 'mypy==1.18.2'
          mypy

      # 🔴 처방과 실측을 한 태그에 담으면 정정이 매번 손으로 나온다 — 이미 넷이 그랬다.
      - name: 증거 태그가 처방/실측을 구분하나 (기준선 대비)
        run: python3 tools/check_evidence_class.py

      - name: 코퍼스 근거는 경로로 인용됐나 (이름 인용은 claim 불변식을 우회한다)
        run: python3 tools/check_name_only_citations.py

      # 종료 표기가 둘이면 "몇 건 남았나" 에 믿을 수 있는 답이 없다.
      - name: GAPS 대장의 종료 표기가 하나인가
        run: python3 tools/check_gaps_ledger.py

      # 덜 익은 근거가 익은 척하면 방향이 실제보다 단단해 보인다 (README 절대규칙 3).
      - name: 덜 익은 코퍼스 인용에 status 가 병기됐나
        run: python3 tools/check_citation_status.py

      # 옛 하네스 이름이 이 저장소를 가리키는 것처럼 읽히면 안 된다.
      - name: 코퍼스 정체성 — 옛 이름이 주어로 늘지 않았나
        run: python3 tools/check_corpus_identity.py

      # 🔴 `direction/` 이 안 가리키는 감사 문서는 다음 세션이 못 찾는다.
      # divcal 회고가 실측으로 보인 그 병이다 — 산문 속 포인터는 안 따라가고,
      # 가리키지도 않으면 존재 자체를 모른다. 기준선 대비 — 새 고아만 막는다.
      - name: 감사 문서가 정본에서 도달 가능한가
        run: python3 tools/check_audit_reachability.py

      # 🔴 현관문이 인용한 목적 한 줄이 **두 판 뒤처져** 있었고, 그것도 rev7 이
      # 명시적으로 기각한 문구("시니어급이 된다" = 자기평가)였다. 가장 먼저 읽히는 자리다.
      - name: 목적 한 줄이 정본과 같은가
        run: python3 tools/check_purpose_sync.py

      # ⚖️ 벽이 **느슨해지면 더 잘 통과한다** — 초록이 오히려 증거처럼 보인다.
      # 그래서 판정으로는 못 막고 **조합**만 막는다: 심판(이 디렉터리 · `ruleset.json`)을
      # 고치는 PR 은 **그것만** 고쳐야 한다. 심판만 바꾸는 PR 은 통과한다(`GAPS` R5-46).
      - name: 심판이 선수와 같이 바뀌지 않는가
        run: python3 tools/check_referee_isolation.py

      # 2026-08-25 추가 (GAPS R5-15). tools/test_*.py 4개가 저장소에 있는데
      # 이 잡이 하나도 돌리지 않았다 — 그래서 7건이 PR #12 의 디렉터리 개편
      # 이후 계속 깨진 채로 초록이었다. 붙이기 전에 그 7건을 먼저 고쳤다.
      # discover 가 -s 디렉터리를 sys.path 에 넣으므로 tools/ 안의 직접 import 가 동작한다.
      - name: 도구 회귀시험
        run: python3 -m unittest discover -s tools -p 'test_*.py'
