# 🤝 **제3자가 이 커밋을 봤는가** — [`audit/GAPS.ko.md`](../../audit/GAPS.ko.md) R5-40 의 ⓒ 층.
# 검사 이름은 `third-party / review`.
#
# 🔴 **로컬 `/review` 와 무엇이 다른가**: 로컬은 **규율**이다 — 에이전트가 안 부르면 그만이고,
# 실측으로 `disallowed-tools` 는 `Bash` 를 안 막는다(2026-08-31 프로브). 여기는 **벽**이다.
#
# ── 이 벽이 보증하는 것 / 안 하는 것 ────────────────────────────────────────
# ✅ **제3자가 *이 커밋* 을 봤다** (옛 커밋의 리뷰는 안 쳐준다)
# 🚫 **잘 짰다** — 리뷰의 판정으로는 안 막는다
#
# 근거는 코퍼스에 등재했다:
#   · `IPW-019` — AI 생성 PR **33,596건 중 61.38%가 리뷰 기록 자체가 없다.**
#     **이 벽이 막는 구멍이 그것이다.**
#   · `IPW-020` — 리뷰 에이전트 **13종 중 12종이 signal ratio 60% 미만** ·
#     닫힌 CRA-only PR 의 **60.2%가 0~30% 소음대**. **findings 로 막으면 소음으로 막는 것**이다.
#   · `IPW-007` — 최선 조건에서도 **F1 28.6%**. 안전망이 아니다.
#     ⚠️ **놓친 비율로 옮겨 적지 않는다** — `1 − F1` 은 위음성률이 아니고 원문은 recall 을 안 낸다.
# (셋 다 `corpus/aspects/28-implementation-process-workflow/…--overview.md` · `status: review-needed`)
#
# ⚠️ **벽이 못 만드는 것**:
# ***"봤다" 는 "읽혔다" 가 아니다.*** 읽는 것은 **머지 버튼을 누르는 사람의 일**이다.
#
# 🔴 **핀을 올린 이유 (2026-09-01 · `workflows#71`)**: 판정이 리뷰 댓글의 `commit_id` 를 봤는데
# **GitHub 이 새 커밋마다 그 필드를 현재 head 로 옮긴다.** 그래서 옛 리뷰의 인라인 댓글 하나만
# 있으면 **그 뒤 모든 푸시가 자동으로 초록**이 됐다 — 실측(`#224` · 두 번 재현): 새 커밋 push 후
# **20초에 SUCCESS**, 진짜 리뷰는 **140~160초 뒤**. 그 사이 머지가 가능했다.
# 이제 `original_commit_id`(안 움직인다)를 본다. **핀을 안 올리면 여기선 안 고쳐진다.**
#
# 🔴 **왜 `ci.yml` 이 아니라 자기 파일인가**: `pull_request_review` 에도 걸려야 한다
# (리뷰가 **비동기**라 붙는 순간 다시 돌아 초록이 되어야 한다). `ci.yml` 에 넣으면
# 리뷰가 달릴 때마다 **CI 전체가 다시 돈다.**
name: third-party

on:
  pull_request:
    # `ready_for_review` — draft 에서는 안 보고(재사용 워크플로의 `if`), ready 로 바뀌는 순간 한 번 본다 (workflows#73).
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write   # 리뷰가 없을 때 `@codex review` 를 다는 데만 쓴다

# 🔴 **취소하지 않는다.** 코덱스가 리뷰를 붙이면 `pull_request_review` 실행이 떠서
# 돌고 있던 실행을 **취소**하는데, **취소는 검사에서 빨강으로 읽힌다**(실측 2026-09-01).
# 거짓 빨강을 안 만드는 게 이 벽의 전부다.
concurrency:
  group: third-party-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  third-party:
    uses: coolbress/workflows/.github/workflows/pr-review.yml@b55a0cef9a20eec58e3e8326d64afa182973d455
