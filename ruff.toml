# `tools/` 정적 검사의 **정본**. 로컬과 CI 가 **같은 파일**을 읽는다 —
# `.python-version` 을 둘이 같이 읽는 것과 같은 이유다(갈리면 하나가 거짓말이다).
#
# 규칙군은 **하나씩 · 실측으로** 켠다 (`audit/GAPS.ko.md` R5-39).
# 🔴 **끄는 규칙에는 근거를 이 파일에 적는다** — 근거 없는 자기 면제가 R5-34 에서 한 번 나왔다.

target-version = "py312"  # `.python-version` 이 정본이고, 이 값은 그것을 따라간다

[lint]
select = [
  "F",    # pyflakes — F821 undefined-name 이 이 검사를 켜게 만든 사건이다
  "E",    # pycodestyle 오류 — E501 을 빼면 **0건**이었다 (아래 ignore)
  "W",    # pycodestyle 경고
  "I",    # import 정렬
  "N",    # 이름 규약
  "UP",   # 낡은 문법
  "B",    # bugbear
  "A",    # 빌트인 가리기
  "C4",   # comprehension
  "SIM",  # 단순화
  "RUF",  # ruff 고유
  "S",    # bandit — 보안. 2026-08-29 신설 (아래 ignore 둘 · S310 은 코드를 고쳤다)
]

ignore = [
  # E501 (312건 · 2026-08-29 실측) — **E 규칙군에서 E501 을 빼면 0건이다.**
  # 줄길이는 포매터의 일인데 이 저장소는 `tools/` 에 포매터를 안 돌린다. 그리고 여기 파이썬은
  # **왜 그렇게 했는지를 주석에 길게 적는 것이 규율**이라(이 파일이 그 예다) 접으면 문장이 쪼개진다.
  # E 를 켜서 얻는 값은 E7xx(`== None` · bare except · 람다 대입) 쪽에 있고, 그건 지금 0건이다.
  "E501",
  # S603/S607 (23건) — 전부 `gh`·`git`·`curl` 호출이다. 인자는 **코드 안의 고정 튜플**에서 오지
  # 사용자 입력이 아니다. 그리고 S607(부분 경로)의 "고침" 은 절대경로를 박는 것인데 **그게 더 나쁘다** —
  # `gh` 는 이 기계에서 `/opt/homebrew/bin`, CI 에서 `/usr/bin` 이다. 박으면 한쪽이 깨진다.
  "S603",
  "S607",
]

# 🚫 **켜지 않기로 한 규칙군** — 침묵이 아니라 기록이다 (`direction/05` §적힌 기각의 논리)
#
# PT (219건) — **기각.** 218건이 PT009(*`assertEqual` 대신 bare `assert`*)다. 이 저장소의 시험은
#   `unittest` 로 돌린다(CI: `python3 -m unittest discover`). PT 는 **pytest 양식** 규칙군이라
#   우리 프레임워크에 대해서는 취향 문제가 아니라 **오작동**이고, bare assert 로 바꾸면
#   `assertEqual` 이 주는 실패 메시지(*무엇이 무엇과 달랐나*)를 잃는다. 순수한 손실이다.
#
# D (239건) — **보류.** 200건이 D101·D102·D103(*독스트링을 써라*)이라 기계 검사가 아니라 글쓰기 과제다.
#   32건(D400·D415)은 *첫 줄을 마침표로 끝내라* 인데 여기 독스트링은 한국어라 "…다" 로 끝난다.
#   켠다면 규칙군이 아니라 **규칙 단위**로 골라야 한다 — R5-39 에 남겨둔다.
