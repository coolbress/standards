# `tools/` 타입 검사의 **정본**. 로컬과 CI 가 **같은 파일**을 읽는다 —
# `ruff.toml` · `.python-version` 과 같은 형태다(설정이 명령줄에 박히면 로컬이 다른 걸 잰다).
#
# 🔴 **`python_version` 을 적지 않는다.** mypy 는 **돌고 있는 인터프리터**를 따라가고,
# 그 버전은 `.python-version` 이 정한다(CI 의 `setup-python` 이 그 파일을 읽는다).
# 여기 숫자를 박으면 `.python-version` 의 **두 번째 사본**이 생기고, 갈려도 아무도 모른다.
#
# `strict` 로 시작할 수 있었던 이유: 비-strict 38건을 고치고 나니 strict 는 **10건**이었고
# 전부 기계적이었다(안 쓰는 `type: ignore` · 빠진 제네릭 인자 · 애너테이션 하나).
# 바닥이 프로젝트에 요구하는 것이 `mypy strict` 이므로 **이 저장소만 면제할 근거가 없다**
# (`audit/GAPS.ko.md` R5-39 · R5-34 와 같은 형태의 자기 면제였다).

[mypy]
strict = True
files = tools
